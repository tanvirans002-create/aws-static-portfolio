<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 650" width="1180" height="650" role="img" aria-labelledby="t d">
  <title id="t">AWS static portfolio architecture</title>
  <desc id="d">Visitors reach a private S3 bucket only through CloudFront using Origin Access Control. A push to main triggers GitHub Actions, which exchanges an OIDC token with AWS STS for temporary credentials, syncs the site folder to S3 and invalidates the CloudFront cache.</desc>
  <defs>
    <marker id="req" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#0969da"/>
    </marker>
    <marker id="dep" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; fill: #1f2328; }
      .h { font-size: 14px; font-weight: 600; }
      .s { font-size: 12px; fill: #59636e; }
      .xs { font-size: 11px; fill: #59636e; }
      .grp { font-size: 13px; font-weight: 600; }
      .lbl { font-size: 12px; paint-order: stroke; stroke: #ffffff; stroke-width: 5px; stroke-linejoin: round; }
      .lbl-req { fill: #0969da; }
      .lbl-dep { fill: #bc4c00; }
      .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.2; }
      .req { fill: none; stroke: #0969da; stroke-width: 2; marker-end: url(#req); }
      .dep { fill: none; stroke: #bc4c00; stroke-width: 2; marker-end: url(#dep); }
      .dep-ret { fill: none; stroke: #bc4c00; stroke-width: 2; stroke-dasharray: 6 4; marker-end: url(#dep); }
    </style>
  </defs>

  <!-- Card background (solid, so it reads in GitHub light and dark mode) -->
  <rect x="0.5" y="0.5" width="1179" height="649" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="40" y="46" style="font-size:20px;font-weight:700">AWS static portfolio: architecture</text>

  <!-- ===== Groups ===== -->
  <!-- GitHub -->
  <rect x="270" y="280" width="300" height="320" rx="12" fill="#fbfcfd" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="286" y="303" class="grp">GitHub</text>

  <!-- AWS Cloud -->
  <rect x="640" y="70" width="510" height="550" rx="12" fill="none" stroke="#57606a" stroke-width="1.5"/>
  <text x="656" y="94" class="grp">AWS Cloud</text>

  <!-- Region -->
  <rect x="870" y="255" width="260" height="170" rx="10" fill="none" stroke="#8c959f" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="1118" y="414" class="s" text-anchor="end">ap-south-1 (Mumbai)</text>

  <!-- ===== Nodes ===== -->
  <!-- Visitor -->
  <rect x="40" y="113" width="180" height="80" rx="10" class="box"/>
  <text x="130" y="149" class="h" text-anchor="middle">Visitor</text>
  <text x="130" y="169" class="s" text-anchor="middle">web browser</text>

  <!-- Developer -->
  <rect x="40" y="322" width="180" height="80" rx="10" class="box"/>
  <text x="130" y="358" class="h" text-anchor="middle">Developer</text>
  <text x="130" y="378" class="s" text-anchor="middle">local clone</text>

  <!-- Repository -->
  <rect x="300" y="330" width="170" height="64" rx="10" class="box"/>
  <text x="385" y="357" class="h" text-anchor="middle">Repository</text>
  <text x="385" y="377" class="s" text-anchor="middle">site/ + deploy.yml</text>

  <!-- GitHub Actions -->
  <rect x="300" y="470" width="240" height="100" rx="10" class="box"/>
  <text x="420" y="503" class="h" text-anchor="middle">GitHub Actions</text>
  <text x="420" y="523" class="s" text-anchor="middle">deploy.yml workflow</text>
  <text x="420" y="543" class="xs" text-anchor="middle">OIDC, no stored AWS keys</text>

  <!-- CloudFront -->
  <rect x="690" y="113" width="220" height="80" rx="10" class="box"/>
  <text x="800" y="140" class="h" text-anchor="middle">Amazon CloudFront</text>
  <text x="800" y="160" class="s" text-anchor="middle">HTTPS · edge cache</text>
  <text x="800" y="177" class="xs" text-anchor="middle">security headers · custom errors</text>

  <!-- S3 -->
  <rect x="895" y="290" width="210" height="100" rx="10" class="box"/>
  <text x="1000" y="318" class="h" text-anchor="middle">Amazon S3 bucket</text>
  <text x="1000" y="337" class="s" text-anchor="middle">Block Public Access ON</text>
  <text x="1000" y="354" class="s" text-anchor="middle">versioned · SSE-S3</text>
  <text x="1000" y="371" class="xs" text-anchor="middle">lifecycle: old versions 30 days</text>

  <!-- IAM / STS -->
  <rect x="690" y="515" width="260" height="72" rx="10" class="box"/>
  <text x="820" y="540" class="h" text-anchor="middle">IAM OIDC provider + STS</text>
  <text x="820" y="559" class="xs" text-anchor="middle">role: gh-actions-learning-log-deploy</text>
  <text x="820" y="575" class="xs" text-anchor="middle">trust pinned to main (immutable sub)</text>

  <!-- ===== Request path (blue) ===== -->
  <path class="req" d="M220,153 H690"/>
  <text x="455" y="143" class="lbl lbl-req" text-anchor="middle">HTTPS GET</text>

  <path class="req" d="M910,153 H960 V290"/>
  <text x="972" y="205" class="lbl lbl-req">OAC (SigV4)</text>
  <text x="972" y="221" class="lbl lbl-req">read only</text>

  <!-- ===== Deploy path (orange) ===== -->
  <path class="dep" d="M220,362 H300"/>
  <text x="260" y="352" class="lbl lbl-dep" text-anchor="middle">git push</text>

  <path class="dep" d="M385,394 V470"/>
  <text x="395" y="436" class="lbl lbl-dep">on push to main</text>

  <path class="dep" d="M540,530 H690"/>
  <text x="615" y="521" class="lbl lbl-dep" text-anchor="middle">OIDC token (JWT)</text>

  <path class="dep-ret" d="M690,557 H540"/>
  <text x="615" y="578" class="lbl lbl-dep" text-anchor="middle">temp credentials</text>

  <path class="dep" d="M540,490 H960 V390"/>
  <text x="770" y="482" class="lbl lbl-dep" text-anchor="middle">aws s3 sync site/ --delete</text>

  <path class="dep" d="M525,470 V245 H770 V193"/>
  <text x="648" y="237" class="lbl lbl-dep" text-anchor="middle">create-invalidation /*</text>

  <!-- ===== Legend ===== -->
  <text x="40" y="470" class="grp">Legend</text>
  <line x1="40" y1="492" x2="80" y2="492" stroke="#0969da" stroke-width="2"/>
  <text x="90" y="496" class="s">visitor request</text>
  <line x1="40" y1="516" x2="80" y2="516" stroke="#bc4c00" stroke-width="2"/>
  <text x="90" y="520" class="s">deploy (CI/CD)</text>
  <line x1="40" y1="540" x2="80" y2="540" stroke="#bc4c00" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="90" y="544" class="s">response</text>
</svg>
